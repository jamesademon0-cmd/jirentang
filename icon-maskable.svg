<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="仁善堂">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c23b30"/>
      <stop offset="1" stop-color="#9c2c24"/>
    </linearGradient>
  </defs>
  <!-- maskable 图标需主体位于中心 80% 安全区，四周留足边距 -->
  <rect width="512" height="512" fill="url(#bgm)"/>
  <rect x="70" y="70" width="372" height="372" rx="70" fill="none" stroke="#c69b50" stroke-width="10" opacity="0.85"/>
  <text x="256" y="266" font-family="'Noto Serif SC','STSong','SimSun','Songti SC',serif" font-size="230" font-weight="900" fill="#f2e8cf" text-anchor="middle" dominant-baseline="central">仁</text>
</svg>
